name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [preview]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  COMPOSE_PROJECT_NAME: magicport-ci
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PHP_VERSION: '8.5.12'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ env.PHP_VERSION }}'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        working-directory: src/be
      - name: Pint dry run
        run: vendor/bin/pint --test || true
        working-directory: src/be
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress || true
        working-directory: src/be

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2

  test:
    name: Tests
    needs: [lint, secret-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ env.PHP_VERSION }}'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        working-directory: src/be
      - name: Generate app key
        run: cp .env.example .env && php artisan key:generate --ansi --force
        working-directory: src/be
      - name: Run tests
        run: vendor/bin/phpunit --no-coverage
        working-directory: src/be

  build:
    name: Build Image
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker BuildKit
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php.dockerfile
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Dependency Audit
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ env.PHP_VERSION }}'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        working-directory: src/be
      - name: Composer audit
        run: composer audit --no-interaction || true
        working-directory: src/be
