name: "magicport"

networks:
  magicport:
    name: magicport

services:
  nginx:
    build:
      context: .
      dockerfile: nginx.dockerfile
      target: runtime
    container_name: ${NGINX_CONTAINER_NAME:-nginx}
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./src/be:/var/www/html/be:delegated
    networks:
      - magicport

  php:
    build:
      context: .
      dockerfile: php.dockerfile
      target: runtime
    container_name: ${PHP_CONTAINER_NAME:-php}
    volumes:
      - ./src/be:/var/www/html/be:delegated
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-project_development}
      - DB_USERNAME=${DB_USERNAME:-magicport}
      - DB_PASSWORD=${DB_PASSWORD:-change-me-in-production}
    networks:
      - magicport

  composer:
    image: ${COMPOSER_IMAGE:-composer:2.8}
    container_name: ${COMPOSER_CONTAINER_NAME:-composer}
    volumes:
      - ./src/be:/var/www/html/be
    working_dir: /var/www/html/be
    networks:
      - magicport

  artisan:
    build:
      context: .
      dockerfile: php.dockerfile
      target: runtime
    container_name: ${ARTISAN_CONTAINER_NAME:-artisan}
    volumes:
      - ./src/be:/var/www/html/be
    working_dir: /var/www/html/be
    entrypoint: ["php", "artisan"]
    environment:
      - APP_ENV=${APP_ENV:-local}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-project_development}
      - DB_USERNAME=${DB_USERNAME:-magicport}
      - DB_PASSWORD=${DB_PASSWORD:-change-me-in-production}
    networks:
      - magicport

  phpunit:
    build:
      context: .
      dockerfile: php.dockerfile
      target: test
    container_name: ${PHPUNIT_CONTAINER_NAME:-phpunit}
    volumes:
      - ./src/be:/var/www/html/be
    working_dir: /var/www/html/be
    environment:
      - APP_ENV=${APP_ENV:-testing}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-project_development}
      - DB_USERNAME=${DB_USERNAME:-magicport}
      - DB_PASSWORD=${DB_PASSWORD:-change-me-in-production}
    networks:
      - magicport

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: ${MYSQL_CONTAINER_NAME:-mysql}
    ports:
      - "${MYSQL_HOST_PORT:-4306}:3306"
    volumes:
      - ./db/mysql:/var/lib/mysql
    networks:
      - magicport
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-project_development}
      - MYSQL_USER=${DB_USERNAME:-magicport}
      - MYSQL_PASSWORD=${DB_PASSWORD:-change-me-in-production}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change-me-in-production}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
