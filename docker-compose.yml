name: "magicport"

networks:
  magicport:
    name: magicport

services:
  nginx:
    build:
      context: .
      dockerfile: nginx.dockerfile
      target: runtime
    container_name: nginx
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./src/be:/var/www/html/be:delegated
    networks:
      - magicport

  php:
    build:
      context: .
      dockerfile: php.dockerfile
      target: runtime
    container_name: php
    volumes:
      - ./src/be:/var/www/html/be:delegated
    networks:
      - magicport

  composer:
    image: composer:2.8
    container_name: composer
    volumes:
      - ./src/be:/var/www/html/be
    working_dir: /var/www/html/be
    networks:
      - magicport

  artisan:
    build:
      context: .
      dockerfile: php.dockerfile
      target: runtime
    container_name: artisan
    volumes:
      - ./src/be:/var/www/html/be
    working_dir: /var/www/html/be
    entrypoint: ["php", "artisan"]
    networks:
      - magicport

  phpunit:
    build:
      context: .
      dockerfile: php.dockerfile
      target: test
    container_name: phpunit
    volumes:
      - ./src/be:/var/www/html/be
    working_dir: /var/www/html/be
    entrypoint: ["/var/www/html/be/vendor/bin/phpunit"]
    networks:
      - magicport

  mysql:
    image: mysql:26.7.0
    container_name: mysql
    ports:
      - "4306:3306"
    volumes:
      - ./db/mysql:/var/lib/mysql
    networks:
      - magicport
    environment:
      - MYSQL_DATABASE=project_development
      - MYSQL_USER=magicport
      - MYSQL_PASSWORD=magicport
      - MYSQL_ROOT_PASSWORD=magicport
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - magicport
