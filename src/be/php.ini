[PHP]
; ============================================================
; Security hardening — PHP2Shell (CVE-2026-109618 / CVE-2026-109619)
; Patched in PHP 8.4.27+. This php.ini adds defense-in-depth.
; ============================================================

; Disable dangerous shell / process functions to reduce RCE surface.
disable_functions = shell_exec,exec,passthru,system,proc_open,popen,pcntl_exec,proc_get_status,proc_close,proc_terminate,escapeshellcmd,escapeshellarg

; Do not expose PHP version in headers.
expose_php = Off

; Limit POST size to reduce OOM attack surface (PHP2Shell CVE-2026-109618).
post_max_size = 16M
upload_max_filesize = 8M
memory_limit = 256M

; Strict error handling — do not display errors in production.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/errors.log

; Session hardening.
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_only_cookies = 1
session.cookie_samesite = Strict

; ============================================================
